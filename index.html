
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontrol LED ESP8266</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eef2f7;
      padding: 30px 15px;
    }
    .panel {
      max-width: 380px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px #0002;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
    }
    input { border: 1px solid #bbb; }
    button { border: 0; color: white; cursor: pointer; }
    .on { background: #16a34a; }
    .off { background: #dc2626; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Kontrol LED ESP8266</h2>
    <p>Masukkan kata sandi kontrol kamu.</p>

    <input id="password" type="password"
           placeholder="Kata sandi CONTROL_PASSWORD">

    <button class="on" onclick="setLED('ON')">LED ON</button>
    <button class="off" onclick="setLED('OFF')">LED OFF</button>

    <p id="status">Siap mengirim perintah.</p>
  </div>

  <script>
    const WORKER_URL =
      "https://small-sky-586ckontrol-led-esp8266.rohmanxjr358.workers.dev";

    async function setLED(command) {
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");

      if (!password) {
        status.textContent = "Masukkan kata sandi terlebih dahulu.";
        return;
      }

      status.textContent = "Mengirim perintah...";

      try {
        const response = await fetch(WORKER_URL + "/set", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, command })
        });

        const result = await response.json();

        if (!response.ok) {
          status.textContent = result.error || "Perintah gagal.";
          return;
        }

        status.textContent =
          "Perintah " + result.command +
          " tersimpan. Pastikan NodeMCU sudah terhubung.";
      } catch (error) {
        status.textContent =
          "Gagal menghubungi server. Periksa koneksi internet.";
      }
    }
  </script>
</body>
</html>
